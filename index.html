<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>LizaMarket | Votre marché en ligne</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- Icons (Font Awesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <!-- ===== TOP BAR ===== -->
    <div class="top-bar">
        <p>Les soldes de saison et les nouveaux arrivages sont arrivés, jetez-y un œil maintenant !</p>
    </div>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="logo">
            <img src="assets/images/logo.png" alt="LizaMarket">
        </div>

        <nav class="nav">
            <a href="#">Accueil</a>
            <a href="#">Boutique</a>
            <a href="#">Meubles</a>
            <a href="#">Vêtements tendances</a>
            <a href="#">Contact</a>
        </nav>

        <div class="header-icons">
            <i class="fa-regular fa-heart"></i>
            <i class="fa-solid fa-cart-shopping"></i>
            <i class="fa-regular fa-user"></i>
        </div>
    </header>

    <!-- ===== MAIN ===== -->
    <main>
        <section class="hero">
    <div class="hero-content">
        <h1>Tout ce dont vous avez besoin, en un seul endroit</h1>
        <p>Fruits, légumes, meubles et produits artisanaux</p>

        <div class="search-box">
            <input type="text" placeholder="Rechercher un produit...">
            <button>
                <i class="fa fa-search"></i>
            </button>
        </div>
    </div>
</section>

        <!-- Hero, sections produits → autres membres -->
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <p>© 2026 LizaMarket — Tous droits réservés</p>
    </footer>

    <script src="assets/js/main.js"></script>
</body>
</html>
